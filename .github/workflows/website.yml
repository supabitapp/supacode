name: Supacode website

on:
  pull_request:
    branches: [main]
    paths: &website-paths
      - apps/supacode.sh/**
      - .github/workflows/website.yml
  push:
    branches: [main]
    paths: *website-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website-check:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node.outputs.node-version }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: apps/supacode.sh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        id: node
        with:
          node-version-file: apps/supacode.sh/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: apps/supacode.sh/package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check-types
      - run: bun run test
      - run: bun run build
      - name: Check Pages output
        run: |
          test -s out/index.html
          cmp public/_worker.js out/_worker.js
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: supacode-website
          path: apps/supacode.sh/out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: website-check
    if: >-
      (github.event.pull_request.head.repo.full_name == github.repository &&
       vars.SUPACODE_PAGES_PREVIEW_ENABLED == 'true') ||
      (github.ref == 'refs/heads/main' &&
       vars.SUPACODE_PAGES_PRODUCTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'supacode-pages-preview' || 'supacode-pages-production' }}
      url: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
    env:
      PAGES_BRANCH: ${{ github.event_name == 'pull_request' && format('supacode-pr-{0}', github.event.pull_request.number) || 'main' }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: supacode-website
          path: out
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ needs.website-check.outputs.node-version }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        id: pages
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.164.0'
          command: pages deploy out --project-name=supacode --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ github.sha }}
      - name: Verify the Pages environment and public routes
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.pages.outputs.pages-environment }}
          EXPECTED_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          if [[ "$DEPLOYMENT_ENVIRONMENT" != "$EXPECTED_ENVIRONMENT" ]]; then
            printf 'Expected a %s deployment, but Cloudflare reported %s.\n' "$EXPECTED_ENVIRONMENT" "$DEPLOYMENT_ENVIRONMENT" >&2
            exit 1
          fi
          test -n "$DEPLOYMENT_URL"
          curl -fsS --retry 3 --retry-all-errors --max-time 20 -o /dev/null "${DEPLOYMENT_URL%/}/"
          curl -fsS --retry 3 --retry-all-errors --max-time 20 --dump-header "$RUNNER_TEMP/appcast.headers" \
            -o /dev/null "${DEPLOYMENT_URL%/}/download/latest/appcast.xml"
          grep -qi '^x-supacode-cache:' "$RUNNER_TEMP/appcast.headers"
          if [[ "$EXPECTED_ENVIRONMENT" == preview ]]; then
            printf 'This preview uses the production license checkout.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
