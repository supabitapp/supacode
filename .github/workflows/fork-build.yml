name: fork-build

# Build the Debug app on feature branches and upload it as an artifact so a
# fork (where local builds are impossible) can download and install a testable
# build. No tests, no signing — just a runnable .app.zip per commit.
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "exp/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    env:
      MISE_HTTP_TIMEOUT: 120
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
      - run: make package-app
      - uses: actions/upload-artifact@v6
        with:
          name: supacode-${{ github.sha }}
          path: build/supacode.app.zip
          if-no-files-found: error
